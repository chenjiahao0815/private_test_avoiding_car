local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      footprint: "[[1.20, 0.55], [1.20, -0.55], [-0.65, -0.55], [-0.65, 0.55]]"
      # plugins: ["static_layer", "voxel_layer", "range_sensor_layer", "inflation_layer"]
      plugins: ["static_layer", "spatio_temporal_voxel_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.0
      spatio_temporal_voxel_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 2.0               # seconds if linear, e^n if exponential
        decay_model: 0                  # 0=linear, 1=exponential, -1=persistent
        voxel_size: 0.05                # meters
        track_unknown_space: true       # default space is known
        mark_threshold: 0               # voxel height
        update_footprint_enabled: false
        combination_method: 1           # 1=max, 0=override
        origin_z: 0.0                   # meters
        publish_voxel_map: false        # default off
        transform_tolerance: 0.3        # seconds
        mapping_mode: false             # default off, saves map not for navigation
        map_save_duration: 60.0         # default 60s, how often to autosave

        # 开启点云裁剪参数
        ignore_width: 50
        ignore_range: 5.2
        ignore_height_above: 0.2
        debug_mode: true

        observation_sources: scan
        front_scan:
          topic: /scan
          clearing: true
          marking: true
          data_type: "LaserScan"
          inf_is_valid: true
          obstacle_range: 5.0          # meters
          min_obstacle_range: 1.5
          min_obstacle_height: 0.05     # default 0, meters
          max_obstacle_height: 1.5
          expected_update_rate: 0.0    # default 0, if not updating at this rate at least, remove from buffer
          observation_persistence: 0.0 # default 0, use all measurements taken during now-value, 0=latest
          filter: "voxel"        # default passthrough, apply "voxel", "passthrough", or no filter to sensor data, recommend on 
          voxel_min_points: 2          # default 0, minimum points per voxel for voxel filter
          clear_after_reading: true    # default false, clear the buffer after the layer gets readings from it
          max_z: 7.0                  # default 0, meters
          min_z: 0.1                  # default 10, meters
          vertical_fov_angle: 0.0  # default 0.7, radians
          horizontal_fov_angle: 6.28 # default 1.04, radians
          decay_acceleration: 0.0     # default 0, 1/s^2. If laser scanner MUST be 0
          model_type: 0                # default 0, model type for frustum. 0=depth camera, 1=3d lidar like VLP16 or similar
      range_sensor_layer:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: true
        topics: ["/ultrasonic1", "/ultrasonic2", "/ultrasonic3", "/ultrasonic4", "/ultrasonic5",
          "/ultrasonic6", "/ultrasonic7", "/ultrasonic8"]
        clear_threshold: 0.2
        mark_threshold: 0.8
        input_sensor_type: "VARIABLE"
        clear_on_max_reading: true #是否清楚超过最大范围的数值.
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: "/nav/keepout/info"
      always_send_full_costmap: true

