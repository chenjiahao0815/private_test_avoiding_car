collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_nav_ctr"
    cmd_vel_out_topic: "cmd_vel_nav"
    transform_tolerance: 0.5
    source_timeout: 5.0
    stop_pub_timeout: 2.0
    recover_stop_timeout: 20.0
    # Velocity-based APPROACH (time-to-collision) branch
    use_velocity_approach_prediction: false
    # Local plan footprint check: STOP if obstacle points exceed APPROACH max_points along path
    use_local_plan_collision_check: true
    local_plan_topic: "local_plan"
    local_plan_footprint_topic: "/local_costmap/published_footprint"
    local_plan_collision_max_points: 10
    local_plan_lookahead_distance: 2.0
    # Arc-length sample step = ratio * max(footprint AABB width, height); invalid footprint uses 0.5 m
    local_plan_sample_spacing_ratio: 0.5
    local_plan_validity_timeout: 5.0
    # Polygons represent zone around the robot for "stop" and "slowdown" action types,
    # and robot footprint for "approach" action type.
    # Footprint could be "polygon" type with dynamically set footprint from footprint_topic
    # or "circle" type with static footprint set by radius. "footprint_topic" parameter
    # to be ignored in circular case.
    # polygons: ["FootprintApproach", "PolygonSlow", "PolygonStop"]
    polygons: ["FootprintApproach"]

    # 开启点云裁剪参数
    ignore_width: 50
    ignore_range: 5.2
    ignore_height_above: 0.2
    debug_mode: true

    PolygonStop:
      type: "polygon"
      points: [1.2, 0.5, 1.2, -0.5, -0.65, -0.5, 0.65, 0.5]
      action_type: "stop"
      max_points: 2
      slowdown_ratio: 0.5
      visualize: true
      polygon_pub_topic: "polygon_stop"
    PolygonSlow:
      type: "polygon"
      points: [3.0, 0.8, 3.0, -0.8, -0.8, -0.8, -0.8, 0.8]
      action_type: "slowdown"
      max_points: 2
      slowdown_ratio: 1.0
      visualize: true
      polygon_pub_topic: "polygon_slowdown"
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 2.0
      simulation_time_step: 0.1
      max_points: 2
      visualize: false
    observation_sources: ["dabai_camera1", "dabai_camera2", "dabai_camera3", "dabai_camera4",
      "scan_close_filter_points"]
    back_scan:
      type: "scan"
      topic: "/back_scan"
    front_scan:
      type: "scan"
      topic: "/front_scan"
    scan_close_filter_points:
      type: "pointcloud"
      topic: "/scan_close_filter_points"
      min_height: 0.2
      max_height: 1.5
    livox:
      type: "pointcloud"
      topic: "/livox/lidar"
      min_height: 0.2
      max_height: 1.5
    vanjee:
