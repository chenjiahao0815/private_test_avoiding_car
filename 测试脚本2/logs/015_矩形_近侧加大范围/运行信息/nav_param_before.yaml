    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    use_sim_time: false
    planner_plugins: ["GridBased"]

    # ---------- FastPath 走廊（只认 254）----------
    enable_straight_expand: true       # 是否先尝试直线走廊，失败再交给 Hybrid
    goal_occupied_tolerance: 1.0       # 目标 254 占用时环搜半径 (m)
    goal_search_resolution: 0.2        # 环搜步长 (m)
    straight_check_length_ratio: 1.0   # footprint 走廊沿线采样步长相对车长
    straight_path_resolution: 0.2      # 直线路径点间距 (m)

    # ---------- through-poses 弱引导 ----------
    rewrite_via_yaw_to_approach: true  # 规划用 G 的 yaw=来向；Hybrid 的 start yaw 保持原方向
    near_distance_threshold: 5.0       # 近段距离阈值；远段中间 via 禁止转线。航向门禁/裁尾/丢 via 只看该距离，不看 yaw
    near_yaw_threshold: 1.57           # 近段转线/伸缩用的航向差 (rad)；不用于 Hybrid 到达/裁尾
    via_heading_tolerance: 0.785        # Hybrid 近段到达与航向裁尾的 |Δψ| (rad)；不与 near_yaw_threshold 复用
    via_heading_trim_length: 1.0       # 航向裁尾最大累计弧长 (m)；从终点往回，超出不再裁
    via_angle_span: 2                  # 折线内角用的前后下标间隔
    edge_colinear_angle_deg: 135.0     # 内角 >= 此值并入同一条覆盖边
    corner_angle_deg: 135.0            # 内角 < 此值标为角点
    short_edge_length: 2.0             # 边长小于则短边 (m)
    corner_sweep_scale: 1.2            # 角点扫掠矩形缩放 k
    corner_snap_tolerance: 1.5         # 角点/短边占用环搜半径 (m)
    corner_snap_enable: true           # 角点扫掠 snap + 短边加严；false 则只打角色日志
    enable_line_stretch: true          # 终点邻域 254 时沿射线缩短 G；最后一段远距离也允许
    line_stretch_max: 1.0
    line_stretch_goal_window: 1.0
    line_stretch_allow_extend: false
    enable_line_rotate: true           # 近段单侧转线；远段关闭；最后一段仍仅近段转线
    line_rotate_max_iters: 5
    line_rotate_goal_shift_tol: 1.0

    goal_push_enable: true             # 远段仍结时：沿「最近 254→G」外推目标一次
    goal_push_distance: 0.5            # 外推距离 (m)，约半车宽 + 1～2 格
    drop_via_max_ratio: 0.7            # 中间 via 丢弃比例上限，超过则整次 through-poses 失败
    corridor_intrusion_tol: 0.3       # 单侧 254 最大侵入；小于该值且对侧净空>=车宽则接受原直线

    # ---------- RViz：planning_debug/* ----------
    publish_planning_debug: false       # 发布调试 Path/Marker；false 则只打日志
    planning_debug_keep_mode: session  # session=一次规划结束整包发出全部 via（Hybrid 各段异色）；current=只显示当前段
    planning_debug_footprint_stride: 0 # session 下默认不沿路画 footprint（避免糊屏）；>0 则按步长累加
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.5                      # tolerance for planning if unable to reach exact pose, in meters
      downsample_costmap: false           # whether or not to downsample the map
      downsampling_factor: 1              # multiplier for the resolution of the costmap layer (e.g. 2 on a 5cm costmap would be 10cm)
      allow_unknown: true                # allow traveling in unknown space
      max_iterations: 5000000             # maximum total iterations to search for before failing (in case unreachable), set to -1 to disable
      max_on_approach_iterations: 1000    # maximum number of iterations to attempt to reach goal once in tolerance
      max_planning_time: 7.0              # max time in s for planner to plan, smooth, and upsample. Will scale maximum smoothing and upsampling times based on remaining time after planning.
      enable_close_range_roi_budget: true
      close_range_roi_margin: 5.0         # meters; ROI is bbox of start/goal cells expanded by ceil(margin/res) cells
      close_range_threshold: 5.0          # if reachable in ROI and shortest path < this (m), use close_range_* limits
      close_range_max_planning_time: 2.5
      close_range_max_iterations: 1000000  # <= 0 means unlimited (same as max_iterations)
      motion_model_for_search: "DUBIN"    # For Hybrid Dubin, Redds-Shepp
      cost_travel_multiplier: 2.0         # For 2D: Cost multiplier to apply to search to steer away from high cost areas. Larger values will place in the center of aisles more exactly (if non-`FREE` cost potential field exists) but take slightly longer to compute. To optimize for speed, a value of 1.0 is reasonable. A reasonable tradeoff value is 2.0. A value of 0.0 effective disables steering away from obstacles and acts like a naive binary search A*.
      angle_quantization_bins: 72         # For Hybrid nodes: Number of angle bins for search, must be 1 for 2D node (no angle search)
      analytic_expansion_ratio: 3.5       # For Hybrid/Lattice nodes: The ratio to attempt analytic expansions during search for final approach.
      analytic_expansion_max_length: 5.0    # For Hybrid/Lattice nodes: The maximum length of the analytic expansion to be considered valid to prevent unsafe shortcutting (in meters). This should be scaled with minimum turning radius and be no less than 4-5x the minimum radius
      minimum_turning_radius: 0.1        # For Hybrid/Lattice nodes: minimum turning radius in m of path / vehicle
      reverse_penalty: 1.5                # For Reeds-Shepp model: penalty to apply if motion is reversing, must be => 1
      change_penalty: 0.0                 # For Hybrid nodes: penalty to apply if motion is changing directions, must be >= 0
      non_straight_penalty: 1.20          # For Hybrid nodes: penalty to apply if motion is non-straight, must be => 1
      cost_penalty: 3.5                   # For Hybrid nodes: penalty to apply to higher cost areas when adding into the obstacle map dynamic programming distance expansion heuristic. This drives the robot more towards the center of passages. A value between 1.3 - 3.5 is reasonable.
      retrospective_penalty: 0.025        # For Hybrid/Lattice nodes: penalty to prefer later maneuvers before earlier along the path. Saves search time since earlier nodes are not expanded until it is necessary. Must be >= 0.0 and <= 1.0
      lookup_table_size: 20.0               # For Hybrid nodes: Size of the dubin/reeds-sheep distance window to cache, in meters.
      cache_obstacle_heuristic: true      # For Hybrid nodes: Cache the obstacle map dynamic programming distance expansion heuristic between subsiquent replannings of the same goal location. Dramatically speeds up replanning performance (40x) if costmap is largely static.  
      smooth_path: true                   # For Lattice/Hybrid nodes: Whether or not to smooth the path, always true for 2D nodes.
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true               # Whether to recursively run the smoother 3 times on the results from prior runs to refine the results further
      tail_trim_length: 2.0               # Hybrid 尾裁窗口 (m)：从终点沿路径往回，按车长抽点；中心线 cost<253 才保留（255 跳过）

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

