      max_height: 1.5
    aurora_back:
      type: "pointcloud"
      topic: "/aurora_back/points2"
      min_height: 0.2
      max_height: 1.5

collision_recover_node:
  ros__parameters:
    use_sim_time: false
    # ---------- 运动 ----------
    linear_speed: 0.2                 # 脱困线速度 (m/s)
    angular_speed: 0.1                # 脱困角速度 (rad/s)
    step_duration: 1.0                # 实走单步最长持续时间 (s)
    max_cycles: 50                    # 脱困最大周期数
    max_rotate_angle: 0.35            # 单次预测/实走最大转角 (rad，0.35≈20°)

    # ---------- 完全脱困：间隙矩形（不用 outside_footprint）----------
    # x ∈ [-back, +front]，y ∈ [-right, +left]，与障碍都不碰才 succeed
    clear_distance_threshold_front: 1.3
    clear_distance_threshold_back: 0.8
    clear_distance_threshold_left: 0.8
    clear_distance_threshold_right: 0.8
    clear_translate_distance: 1.0     # Phase1 纯平移/转后平移预测距离 (m)

    # ---------- 碰撞判定 ----------
    collision_epsilon: 0.02           # 边距小于该值视为碰撞 (m)
    prediction_time: 0.5              # 定时器/Service 用 odom 速度预测碰撞的时间窗 (s)
    prediction_horizon: 5.0           # 多步预测总时长 (s)
    prediction_dt: 0.1                # 多步预测离散步长 (s)

    # ---------- 分区分类（滞回）----------
    X_front: 0.8                      # A.x 大于该值进入前脸 (m)
    X_front_exit_margin: 0.08         # 前脸退出滞回 Δ_x (m)
    Y_side_enter: 0.05                # |A.y| 大于该值才切换左/右 (m)
    rear_x_epsilon: 0.0               # A.x 小于 -该值视为后方 (m)

    # ---------- 轮廓 ----------
    # 内缩轮廓 [x1,y1,...]，旋转/缓解硬约束，必须配置
    inside_footprint: [1.15, 0.55, 1.15, -0.55, -0.68, -0.55, -0.68, 0.55]
    # 扩展轮廓，仅供 collision_detection_service (data=true)，不参与完全脱困
    outside_footprint: [1.25, 0.75, 1.25, -0.75, -0.8, -0.75, -0.8, 0.75]

    # ---------- 其它 ----------
    debug: true                       # 发布 inside/outside/间隙矩形/分区碰撞点/规划轨迹
    distance_improve_epsilon: 0.01    # 兼容保留，现不作为主路径成功判据
    side_block_front_back_dist: 0.15  # 兼容保留，现已由分区碰撞替代

