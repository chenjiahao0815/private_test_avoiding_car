    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [1.0, 0.0, 0.4]
    min_velocity: [-0.5, 0.0, -0.4]
    max_accel: [0.5, 0.0, 0.8]
    max_decel: [-0.5, 0.0, -0.8]
